<!doctype html>
<html>
<head><meta charset="utf-8"><title>ToggleButton — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap"></head>
<body>
<div id="root" class="sg-col"></div>
<script>
  var S = window.SeaGlass, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { style: { display: 'flex', gap: 'var(--space-2)', flexWrap: 'wrap', background: 'color-mix(in oklab, var(--cobalt-fill) 28%, var(--paper))', borderRadius: '28px', padding: 'var(--space-4)' } },
      h(S.ToggleButton, { icon: 'dialpad', label: 'Keypad' }),
      h(S.ToggleButton, { icon: 'mic', label: 'Mute' }),
      h(S.ToggleButton, { icon: 'speaker', label: 'Speaker', defaultPressed: true }),
      h(S.ToggleButton, { icon: 'more-vert', label: 'More', menuItems: [{ icon: 'plus', label: 'Add call' }, { icon: 'video', label: 'Video call' }, { icon: 'comment', label: 'Send message' }, { icon: 'settings', label: 'Call settings' }] })),
    h(S.Button, { tone: 'coral', size: 'xl', icon: 'call-end', filled: true, label: 'End call' })));
</script>
</body>
</html>
