<!doctype html>
<html>
<head><meta charset="utf-8"><title>Chip — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap"></head>
<body>
<div id="root" class="sg-stage"></div>
<script>
  var S = window.SeaGlass, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(S.Chip, { tone: 'seafoam' }, 'Online'),
    h(S.Chip, { tone: 'amber' }, 'Pending'),
    h(S.Chip, { tone: 'coral', icon: 'close' }, 'Failed'),
    h(S.Chip, { tone: 'aqua' }, 'Shared'),
    h(S.Chip, { tone: 'frost', onClick: function () {}, selected: true }, 'Filter: 2024')));
</script>
</body>
</html>
