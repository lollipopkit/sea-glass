<!doctype html>
<html>
<head><meta charset="utf-8"><title>Slider — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap"></head>
<body>
<div id="root" class="sg-col" style="align-items:stretch;max-width:480px"></div>
<script>
  var S = window.SeaGlass, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(S.Slider, { label: 'Grain', min: 0, max: 0.4, step: 0.01, defaultValue: 0.3, format: function (v) { return v.toFixed(2); } }),
    h(S.Slider, { label: 'Volume', tone: 'lilac', defaultValue: 64, format: function (v) { return v + '%'; } }),
    h(S.Slider, { label: 'Disabled', tone: 'frost', defaultValue: 30, disabled: true })));
</script>
</body>
</html>
